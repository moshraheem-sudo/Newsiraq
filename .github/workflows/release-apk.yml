name: Build & Publish Android APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.7.0)"
        required: true
        default: "v1.7.0"
      release_title:
        description: "Release title"
        required: false
        default: "أخبار العالم | World News"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ensure debug keystore exists for CI builds
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon || true

      - name: Build APK
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.STORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks
            KEYSTORE_PATH="$PWD/my-upload-key.jks" \
            STORE_PASSWORD="${{ secrets.STORE_PASSWORD }}" \
            KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}" \
            gradle :app:assembleRelease --no-daemon
            APK_SRC="app/build/outputs/apk/release/app-release.apk"
          else
            gradle :app:assembleDebug --no-daemon
            APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          fi
          TAG="${INPUT_TAG:-$REF_NAME}"
          OUT_APK="WorldNews-${TAG}.apk"
          cp "$APK_SRC" "$OUT_APK"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "OUT_APK=$OUT_APK" >> "$GITHUB_ENV"

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ github.event.inputs.release_title || format('World News {0}', env.TAG) }}
          generate_release_notes: true
          files: |
            ${{ env.OUT_APK }}
