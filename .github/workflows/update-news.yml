name: Update News Data & Sync Pages

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: world-news-data-sync
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: iraq-news-hub/requirements.txt

      - name: Install dependencies
        working-directory: iraq-news-hub
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper unit tests
        working-directory: iraq-news-hub
        run: python -m unittest discover -s tests -t . -v

      - name: Scrape public Telegram, RSS, and X sources
        working-directory: iraq-news-hub
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m scraper.main --force
          else
            python -m scraper.main
          fi

      - name: Sync Android bundled snapshot & commit data changes
        run: |
          cp iraq-news-hub/data/news.json app/src/main/assets/news.json
          cp iraq-news-hub/data/sources_status.json app/src/main/assets/sources_status.json
          cp iraq-news-hub/config/sources.json app/src/main/assets/sources.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iraq-news-hub/data/news.json iraq-news-hub/data/sources_status.json \
            app/src/main/assets/news.json app/src/main/assets/sources_status.json app/src/main/assets/sources.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(news): auto-update news data and app snapshot"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi

      - name: Build GitHub Pages artifact
        working-directory: iraq-news-hub
        run: python scripts/build_site.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "iraq-news-hub/_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
